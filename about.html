<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="samuel osei — a personal website - about me" />
  <meta property="og:description" content="nsateaa nyinaa nnyɛ pɛ" />
  <meta property="og:image" content="https://github.com/user-attachments/assets/e6ab75cd-a366-4cbe-82bb-8c5a3e8e20c5" />
  <meta property="og:url" content="https://voightachrome.com" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image">
  <title>About Me</title> 
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/voightachrome/voightachrome.github.io/refs/heads/main/Nichijou%20Logo%20(1).ico">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @font-face {
      font-family: 'Constantia';
      src: url('fonts/constantia.woff2') format('woff2'),
           url('fonts/constantia.woff')  format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    body {
      font-family: 'Constantia', Georgia, serif;
      background-color: #f5f5f5;
      color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding-bottom: 60px;
      -ms-overflow-style: none;  
      scrollbar-width: none;     
    }

    body::-webkit-scrollbar {
      display: none;             
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center; /* Vertically centers the image on the left side relative to the text */
      gap: 40px;
      width: 100%;
      max-width: 1200px;
      padding: 40px 20px;
      max-height: 100%;
      overflow-y: auto;
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .container::-webkit-scrollbar {
      display: none;
    }
  
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    @media (max-width: 800px) {
      .container {
        flex-direction: column !important;
        align-items: center;
        gap: 30px;
      }
      
      img {
        max-width: 100% !important;
      }
    }
   
    img {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
  
    .content {
      text-align: left; 
      width: 100%;
      max-width: 650px;
    }

    /* Styling parsed markdown elements */
    .content p, .content li {
      margin: 10px 0;
      font-size: 1.1em;
      line-height: 1.6;
    }

    .content p:first-child {
      margin-top: 0;
    }

    .content h3 {
      margin-top: 40px;
      font-size: 1.4em;
    }

    /* Footer */
    footer {
      font-size: 1rem;
      width: 100%;
      text-align: center;
      background-color: #f5f5f5;
      padding: 10px 0;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }

    footer a {
      text-decoration: none;
      color: #0077cc;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://raw.githubusercontent.com/voightachrome/voightachrome.github.io/refs/heads/main/Websitephoto6.jpg" alt="Me and My Family">
    
    <div class="content" id="markdown-content"></div>
    
  </div>
  
  <footer>
    <a href="index.html">Home</a>
  </footer>

  <script>
    const githubRawUrl = 'https://raw.githubusercontent.com/voightachrome/voightachrome.github.io/main/about.md';

    fetch(githubRawUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response failed');
        }
        return response.text();
      })
      .then(text => {
        document.getElementById('markdown-content').innerHTML = marked.parse(text);
      })
      .catch(error => {
        console.error('Error loading markdown file:', error);
        document.getElementById('markdown-content').innerHTML = '<p>Error</p>';
      });
  </script>
</body>
</html>
